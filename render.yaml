services:
  - type: web
    name: skilly
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn skilly_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render genera automáticamente una clave segura
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "skilly.onrender.com" # ← Reemplaza con tu dominio real tras el deploy
      - key: DATABASE_URL
        fromDatabase:
          name: skilly-db
          property: connectionString

      # ── Seguridad del Admin ─────────────────────────────────────────
      # ADMIN_URL_PATH: URL secreta del panel Django Admin.
      # ⚠️  OBLIGATORIO cambiar en Render Dashboard antes del primer deploy.
      # Usa algo como: x9k2p7mj4-control-skilly-2024/
      - key: ADMIN_URL_PATH
        value: "django-admin/"       # ← CAMBIA ESTO en Render Dashboard

      # ADMIN_ALLOWED_IPS: IPs autorizadas para acceder al admin.
      # Si está vacío, solo 127.0.0.1 (Render Shell) puede acceder.
      # Recomendación: agrega tu IP fija de trabajo o la de tu VPN.
      - key: ADMIN_ALLOWED_IPS
        value: ""                    # ← Agrega tu IP: 1.2.3.4,5.6.7.8

      # ── Pasarela de Pagos Transbank Webpay Plus ─────────────────────
      # Opera por defecto en modo TEST (Sandbox oficial de Transbank).
      # En producción real con contrato Transbank: cambia a LIVE y pon tus credenciales.
      - key: TRANSBANK_ENVIRONMENT
        value: "TEST"                # TEST para pruebas | LIVE para producción
      - key: TRANSBANK_COMMERCE_CODE
        value: ""                    # Opcional en TEST / Requerido en LIVE
      - key: TRANSBANK_API_KEY
        value: ""                    # Opcional en TEST / Requerido en LIVE

      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: skilly-db
    databaseName: skilly
    user: skilly
    plan: free
