<!-- -- PLANTILLA DE INICIO DE SESIÓN -- -->
{% extends 'base.html' %}

{% block title %}Iniciar Sesión | Skilly{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full glass-panel p-8 rounded-2xl shadow-xl space-y-6">
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-brand-100 text-brand-600 flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Iniciar Sesión en Skilly</h2>
            <p class="text-xs text-slate-500 mt-1">Accede a tu panel de control, agenda y contrataciones</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nombre de Usuario</label>
                <input type="text" name="username" id="id_username" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 font-medium text-slate-800" placeholder="tu_usuario">
            </div>

            <div>
                <label for="id_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" name="password" id="id_password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 font-medium text-slate-800" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                Ingresar a Skilly <i class="fa-solid fa-right-to-bracket ml-2"></i>
            </button>
        </form>

        <div class="pt-4 border-t border-slate-200 text-center text-xs text-slate-600">
            ¿Aún no tienes una cuenta? <a href="{% url 'users:register' %}" class="font-bold text-brand-600 hover:underline">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}
